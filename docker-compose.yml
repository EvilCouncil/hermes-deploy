services:
  hermes-agent:
    image: nousresearch/hermes-agent:v2026.8.3
    container_name: hermes-agent
    restart: unless-stopped
    ports:
      - "5100:5000"
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HERMES_PORT=5000
    volumes:
      - /srv/hermes:/opt/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - hermes-net

networks:
  hermes-net:
    name: hermes-net
    driver: bridge
